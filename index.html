<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SiteBuilder V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#111;color:#eee;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-columns:230px 1fr 290px;grid-template-rows:58px 1fr}
.top{grid-column:1/4;background:#181818;border-bottom:1px solid #303030;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-weight:900;font-size:19px;margin-right:auto}.logo span{color:#7c5cff}
.top button,.tool{background:#252525;color:#eee;border:1px solid #3b3b3b;border-radius:7px;padding:8px 11px}.top button:hover,.tool:hover{background:#333}
.sidebar,.props{background:#181818;overflow:auto;padding:14px;border-right:1px solid #303030}.props{border-left:1px solid #303030;border-right:0}
h3{font-size:12px;text-transform:uppercase;color:#888;margin:7px 0 10px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.el{background:#222;border:1px solid #373737;border-radius:8px;padding:12px 7px;text-align:center;color:#ddd}.el:hover{border-color:#7c5cff;background:#29233d}
.stage-wrap{background:#0d0d0d;overflow:auto;padding:35px;display:flex;justify-content:center;align-items:flex-start}
.stage{background:white;color:#111;width:900px;min-height:650px;box-shadow:0 12px 45px #000;position:relative;padding:28px;transition:.2s}
.stage.mobile{width:390px;min-height:700px}.stage.empty:after{content:"Drop elements here";position:absolute;inset:30px;border:2px dashed #bbb;display:grid;place-items:center;color:#aaa;font-size:20px;pointer-events:none}
.element{position:relative;min-height:10px;margin:6px 0;padding:5px;outline:1px solid transparent}.element:hover{outline:1px dashed #8b72ff}.element.selected{outline:2px solid #7c5cff}.element img{max-width:100%;display:block}.element button{border:0}
.row{display:flex;gap:7px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#222;color:#eee;border:1px solid #3b3b3b;border-radius:6px;padding:8px}.field textarea{min-height:75px;resize:vertical}
.richbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;background:#202020;border:1px solid #3b3b3b;border-radius:6px;padding:5px}
.richbar .tool{padding:5px 9px}
.richbar input[type=color]{width:32px;height:30px;padding:2px;background:#222;border:1px solid #444;border-radius:5px}
.richtext{min-height:95px;max-height:220px;overflow:auto;background:#222;color:#eee;border:1px solid #3b3b3b;border-radius:6px;padding:9px;outline:none}
.richtext:focus{border-color:#7c5cff}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.danger{background:#3a1717!important;border-color:#662828!important;color:#ff9b9b!important}
.tabs{display:flex;gap:5px;margin-bottom:12px}.tabs button{flex:1;background:#222;color:#aaa;border:1px solid #333;padding:7px;border-radius:6px}.tabs button.active{color:white;background:#352d55}
.status{font-size:11px;color:#888;margin-top:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{width:min(850px,90vw);height:min(75vh,700px);background:#181818;border:1px solid #444;border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:10px}.modalbox textarea{flex:1;background:#0d0d0d;color:#ddd;border:1px solid #333;border-radius:8px;padding:12px;font-family:monospace;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#292929;border:1px solid #444;padding:9px 14px;border-radius:8px;display:none;z-index:30}.toast.show{display:block}
@media(max-width:850px){.app{grid-template-columns:190px 1fr}.props{display:none}.top{grid-column:1/3}.sidebar{font-size:12px}.stage-wrap{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">SiteBuilder <span>V2</span></div>
  <button onclick="newSite()">New</button><button onclick="undo()">↶</button><button onclick="redo()">↷</button>
  <button onclick="saveSite()">Save</button><button onclick="loadSite()">Load</button>
  <button onclick="openExport()">Export</button>
  <button onclick="togglePreview()">Preview</button>
</header>

<aside class="sidebar">
<h3>Elements</h3>
<div class="palette">
 <div class="el" draggable="true" data-type="heading">H1 Heading</div>
 <div class="el" draggable="true" data-type="text">Text</div>
 <div class="el" draggable="true" data-type="button">Button</div>
 <div class="el" draggable="true" data-type="image">Image</div>
 <div class="el" draggable="true" data-type="container">Container</div>
 <div class="el" draggable="true" data-type="columns">2 Columns</div>
 <div class="el" draggable="true" data-type="divider">Divider</div>
 <div class="el" draggable="true" data-type="spacer">Spacer</div>
 <div class="el" draggable="true" data-type="html">HTML</div>
</div>
<h3>Quick sections</h3>
<div class="palette">
 <button class="el" onclick="addPreset('hero')">Hero</button>
 <button class="el" onclick="addPreset('cards')">Cards</button>
 <button class="el" onclick="addPreset('about')">About</button>
</div>
<div class="status">Drag an element onto the page. Click it to edit. Double-click text to edit directly.</div>
</aside>

<main class="stage-wrap" id="wrap">
 <div class="stage empty" id="stage" onclick="stageClick(event)" ondragover="event.preventDefault()" ondrop="dropElement(event)">
 </div>
</main>

<aside class="props">
<h3>Inspector</h3>
<div id="inspector"><div style="color:#888;font-size:13px">Select an element.</div></div>
</aside>
</div>

<div class="modal" id="modal"><div class="modalbox">
 <div style="display:flex;align-items:center"><b>Export HTML</b><button style="margin-left:auto" onclick="closeExport()">✕</button></div>
 <textarea id="exportText"></textarea>
 <div><button class="tool" onclick="copyExport()">Copy HTML</button><button class="tool" onclick="downloadExport()">Download HTML</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
let selected=null, history=[], future=[], draggingType=null, preview=false;
const stage=document.getElementById('stage');

const defaults={
 heading:{html:'<h1>My Heading</h1>'}, text:{html:'<p>Write something here...</p>'},
 button:{html:'<a href="#" class="sb-btn">Click me</a>'},
 image:{html:'<img src="https://placehold.co/800x300?text=Your+Image" alt="Image">' },
 container:{html:'<div class="inner-container"><p>Container content</p></div>'},
 columns:{html:'<div class="cols"><div><h3>Column 1</h3><p>Content</p></div><div><h3>Column 2</h3><p>Content</p></div></div>'},
 divider:{html:'<hr>'},spacer:{html:'<div style="height:70px"></div>'},html:{html:'<div><b>Custom HTML</b></div>'}
};

document.querySelectorAll('.el[draggable]').forEach(x=>{
 x.addEventListener('dragstart',e=>draggingType=e.currentTarget.dataset.type);
});

function pushHistory(){history.push(stage.innerHTML);if(history.length>50)history.shift();future=[]}
function render(){stage.classList.toggle('empty',!stage.children.length);select(selected)}
function addElement(type,html=null){
 pushHistory(); const el=document.createElement('div'); el.className='element'; el.dataset.type=type;
 el.innerHTML=html||defaults[type].html; el.onclick=e=>{e.stopPropagation();select(el)};
 el.ondblclick=e=>{if(['text','heading'].includes(type)){e.stopPropagation();editText(el)}};
 stage.appendChild(el); select(el); render();
}
function dropElement(e){e.preventDefault();if(draggingType)addElement(draggingType);draggingType=null}
function stageClick(){select(null)}
function select(el){selected=el;document.querySelectorAll('.element').forEach(x=>x.classList.toggle('selected',x===el));buildInspector()}
function editText(el){
 const target=el.querySelector('h1,h2,h3,h4,p,span');
 if(!target)return; const v=prompt('Edit text:',target.innerText);if(v!==null){pushHistory();target.innerText=v;buildInspector()}
}
function buildInspector(){
 const box=document.getElementById('inspector'); if(!selected){box.innerHTML='<div style="color:#888;font-size:13px">Select an element.</div>';return}
 const cs=getComputedStyle(selected), inner=selected.innerHTML.replaceAll('"','&quot;');
 box.innerHTML=`
 <div class="tabs"><button class="active">Style</button><button onclick="editRaw()">HTML</button></div>
 <div class="field"><label>Element</label><input value="${selected.dataset.type}" disabled></div>
 <div class="field"><label>Text formatting</label>
  <div class="row">
   <button type="button" class="tool" id="boldBtn"><b>B</b></button>
   <button type="button" class="tool" id="italicBtn"><i>I</i></button>
   <button type="button" class="tool" id="underlineBtn"><u>U</u></button>
   <button type="button" class="tool" id="strikeBtn"><s>S</s></button>
  </div>
 </div>
 <div class="field"><label>Text / Content</label>
  <div class="richbar">
   <button type="button" class="tool" onclick="richCmd('bold')"><b>B</b></button>
   <button type="button" class="tool" onclick="richCmd('italic')"><i>I</i></button>
   <button type="button" class="tool" onclick="richCmd('underline')"><u>U</u></button>
   <button type="button" class="tool" onclick="richCmd('strikeThrough')"><s>S</s></button>
   <button type="button" class="tool" onclick="richCmd('justifyLeft')">≡</button>
   <button type="button" class="tool" onclick="richCmd('justifyCenter')">☰</button>
   <button type="button" class="tool" onclick="richCmd('justifyRight')">≡</button>
   <input id="richColor" type="color" title="Text color" value="${rgbHex(cs.color)}" onchange="richColor(this.value)">
  </div>
  <div id="pcontent" class="richtext" contenteditable="true">${selected.innerHTML}</div>
 </div>
 <div class="field"><label>Text color</label><input type="color" id="color" value="${rgbHex(cs.color)}"></div>
 <div class="field"><label>Background</label><input type="color" id="bg" value="${rgbHex(cs.backgroundColor)}"></div>
 <div class="grid2">
  <div class="field"><label>Font size</label><input id="fs" type="number" value="${parseInt(cs.fontSize)||16}"></div>
  <div class="field"><label>Radius</label><input id="rad" type="number" value="${parseInt(cs.borderRadius)||0}"></div>
 </div>
 <div class="field"><label>Font</label>
  <select id="font">
   <option value="Arial, sans-serif">Arial</option>
   <option value="Georgia, serif">Georgia</option>
   <option value="'Times New Roman', serif">Times New Roman</option>
   <option value="Verdana, sans-serif">Verdana</option>
   <option value="Tahoma, sans-serif">Tahoma</option>
   <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
   <option value="'Courier New', monospace">Courier New</option>
   <option value="Impact, sans-serif">Impact</option>
   <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
   <option value="system-ui, sans-serif">System UI</option>
   <option value="monospace">Monospace</option>
  </select>
 </div>
 <div class="grid2">
  <div class="field"><label>Line height</label><input id="lh" value="${cs.lineHeight==='normal'?'normal':cs.lineHeight}"></div>
  <div class="field"><label>Letter spacing</label><input id="ls" value="${cs.letterSpacing}"></div>
 </div>
 <div class="grid2">
  <div class="field"><label>Padding</label><input id="pad" value="${cs.padding}"></div>
  <div class="field"><label>Margin</label><input id="mar" value="${cs.margin}"></div>
 </div>
 <div class="field"><label>Width</label><select id="width"><option value="auto">Auto</option><option value="100%">100%</option><option value="50%">50%</option><option value="fit-content">Fit content</option></select></div>
 <div class="field"><label>Align</label><select id="align"><option>left</option><option>center</option><option>right</option></select></div>
 ${selected.dataset.type==='image'?'<div class="field"><label>Image URL</label><input id="imgurl" value="'+(selected.querySelector('img')?.src||'')+'"></div>':''}
 ${selected.dataset.type==='button'?'<div class="field"><label>Button link</label><input id="link" value="'+(selected.querySelector('a')?.href||'#')+'"></div>':''}
 <div class="row"><button class="tool" onclick="duplicate()">Duplicate</button><button class="tool danger" onclick="removeSelected()">Delete</button></div>`;
 ['color','bg','fs','rad','font','lh','ls','pad','mar','width','align','imgurl','link'].forEach(id=>{
   const q=document.getElementById(id);if(q)q.oninput=()=>applyProp(id,q.value)
 });
 const fontSelect=document.getElementById('font');
 if(fontSelect){
   const currentFont=cs.fontFamily;
   [...fontSelect.options].forEach(o=>{if(o.value===currentFont)o.selected=true});
 }
 const boldBtn=document.getElementById('boldBtn');
 const italicBtn=document.getElementById('italicBtn');
 const underlineBtn=document.getElementById('underlineBtn');
 const strikeBtn=document.getElementById('strikeBtn');
 if(boldBtn)boldBtn.onclick=()=>toggleFormat('fontWeight','bold','normal');
 if(italicBtn)italicBtn.onclick=()=>toggleFormat('fontStyle','italic','normal');
 if(underlineBtn)underlineBtn.onclick=()=>toggleDecoration('underline');
 if(strikeBtn)strikeBtn.onclick=()=>toggleDecoration('line-through');
 document.getElementById('pcontent').oninput=()=>{
   if(!selected)return;
   selected.innerHTML=document.getElementById('pcontent').innerHTML;
 };
 document.getElementById('pcontent').onblur=()=>{if(selected){pushHistory();buildInspector()}}
}
function richCmd(command){
 const editor=document.getElementById('pcontent');
 if(!editor)return;
 editor.focus();
 document.execCommand(command,false,null);
 if(selected){
   selected.innerHTML=editor.innerHTML;
 }
}
function richColor(color){
 const editor=document.getElementById('pcontent');
 if(!editor)return;
 editor.focus();
 document.execCommand('foreColor',false,color);
 if(selected)selected.innerHTML=editor.innerHTML;
}
function toggleFormat(prop,on,off){
 if(!selected)return;
 pushHistory();
 selected.style[prop]=getComputedStyle(selected)[prop]===on?off:on;
 buildInspector();
}
function toggleDecoration(dec){
 if(!selected)return;
 pushHistory();
 const cur=getComputedStyle(selected).textDecorationLine;
 selected.style.textDecoration=cur.includes(dec)?'none':dec;
 buildInspector();
}
function setText(el,v){
 const t=el.querySelector('h1,h2,h3,h4,p,span,.sb-btn');if(t)t.innerText=v;else el.innerHTML=v
}
function applyProp(id,v){
 if(!selected)return;
 if(id==='color')selected.style.color=v;
 if(id==='bg')selected.style.backgroundColor=v;
 if(id==='fs')selected.style.fontSize=v+'px';
 if(id==='font')selected.style.fontFamily=v;
 if(id==='lh')selected.style.lineHeight=v;
 if(id==='ls')selected.style.letterSpacing=v;
 if(id==='rad')selected.style.borderRadius=v+'px';
 if(id==='pad'||id==='mar')selected.style[id==='pad'?'padding':'margin']=v;
 if(id==='width')selected.style.width=v;
 if(id==='align')selected.style.textAlign=v;
 if(id==='imgurl'&&selected.querySelector('img'))selected.querySelector('img').src=v;
 if(id==='link'&&selected.querySelector('a'))selected.querySelector('a').href=v;
}
function duplicate(){if(!selected)return;pushHistory();let n=selected.cloneNode(true);n.onclick=e=>{e.stopPropagation();select(n)};n.ondblclick=e=>editText(n);selected.after(n);select(n);render()}
function removeSelected(){if(!selected)return;pushHistory();selected.remove();selected=null;render()}
function undo(){if(!history.length)return;future.push(stage.innerHTML);stage.innerHTML=history.pop();rebind();render()}
function redo(){if(!future.length)return;history.push(stage.innerHTML);stage.innerHTML=future.pop();rebind();render()}
function rebind(){stage.querySelectorAll('.element').forEach(el=>{el.onclick=e=>{e.stopPropagation();select(el)};el.ondblclick=e=>{if(['text','heading'].includes(el.dataset.type))editText(el)}})}
function rgbHex(c){if(!c||c==='transparent')return '#ffffff';let m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#ffffff'}

function addPreset(kind){
 pushHistory();
 let s='';
 if(kind==='hero')s=`<div class="element" data-type="hero"><section style="padding:70px 30px;text-align:center;background:#171717;color:white;border-radius:18px"><h1 style="font-size:48px;margin:0 0 12px">Welcome to my site</h1><p>This is my extremely cool website.</p><a href="#" class="sb-btn" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:white;border-radius:8px;text-decoration:none">Get Started</a></section></div>`;
 if(kind==='about')s=`<div class="element" data-type="about"><section style="padding:35px"><h2>About Me</h2><p>Tell people who you are, what you make, and why this site exists.</p></section></div>`;
 if(kind==='cards')s=`<div class="element" data-type="cards"><section><h2>My Projects</h2><div class="cols"><div><h3>Project One</h3><p>Something awesome.</p></div><div><h3>Project Two</h3><p>Another thing.</p></div></div></section></div>`;
 stage.insertAdjacentHTML('beforeend',s);rebind();select(stage.lastElementChild);render()
}
function saveSite(){localStorage.setItem('sitebuilder-v2',stage.innerHTML);toast('Saved!')}
function loadSite(){const x=localStorage.getItem('sitebuilder-v2');if(x!==null){pushHistory();stage.innerHTML=x;rebind();render();toast('Loaded!')}else toast('Nothing saved yet.')}
function newSite(){if(confirm('Start a new site?')){pushHistory();stage.innerHTML='';selected=null;render()}}
function togglePreview(){preview=!preview;document.querySelector('.sidebar').style.display=preview?'none':'';document.querySelector('.props').style.display=preview?'none':'';document.querySelector('.top').style.gridColumn=preview?'1/4':'';document.querySelector('.stage-wrap').style.gridColumn=preview?'1/4':''}
function cleanExport(){
 const clone=stage.cloneNode(true);clone.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
 return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Website</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111}.element{position:relative;min-height:10px;margin:6px 0;padding:5px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sb-btn{display:inline-block;text-decoration:none;padding:10px 18px;background:#7c5cff;color:white;border-radius:7px}img{max-width:100%}@media(max-width:600px){.cols{grid-template-columns:1fr}}</style></head><body>${clone.innerHTML}</body></html>`
}
function openExport(){document.getElementById('exportText').value=cleanExport();document.getElementById('modal').classList.add('show')}
function closeExport(){document.getElementById('modal').classList.remove('show')}
async function copyExport(){await navigator.clipboard.writeText(document.getElementById('exportText').value);toast('Copied HTML!')}
function downloadExport(){const b=new Blob([document.getElementById('exportText').value],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';a.click();URL.revokeObjectURL(a.href)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='Delete'&&selected&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))removeSelected()});
render();
</script>
</body>
</html>
